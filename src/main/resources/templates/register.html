<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - SkillBridge</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo a {
            text-decoration: none;
            font-size: 25px;
            font-weight: 700;
            color: #111827;
        }

        .logo span {
            color: #4f46e5;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.06);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 12px 13px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #4f46e5;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            border: none;
            background: #4f46e5;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

    </style>
    <link rel="stylesheet" href="/css/app-theme.css">

</head>

<body class="auth-page">

<header th:replace="~{fragments/site-header :: siteHeader('public', false)}"></header>

<div class="container">

    <div class="logo">
        <a href="/">
            Skill<span>Bridge</span>
        </a>
    </div>

    <div class="card">

        <h1>Create your account</h1>

        <p class="subtitle">
            Join SkillBridge and start learning and sharing skills.
        </p>

        <div th:if="${error}"
             class="error"
             th:text="${error}">
        </div>

        <form action="/register"
              method="post">

            <label>Full Name</label>

            <input type="text"
                   name="fullName"
                   placeholder="Enter your full name"
                   required>

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>

            <label>Short Bio</label>

            <textarea name="bio"
                      placeholder="Tell us a little about yourself"></textarea>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
