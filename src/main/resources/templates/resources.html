<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learning Resources | SkillBridge</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <style>
        .module-page{max-width:1000px;margin:0 auto;padding:32px}
        .module-nav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px}
        .module-nav a{color:#365b50;font-weight:600;text-decoration:none}
        .module-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px 0;border-bottom:1px solid #dfe5e1}
        .module-form input,.module-form textarea,.module-form button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5cf;border-radius:6px}
        .module-form textarea{grid-column:1/-1;min-height:80px}
        .module-form button{background:#285b4b;color:#fff;border:0;cursor:pointer}
        .resource{padding:18px 0;border-bottom:1px solid #dfe5e1}
        .resource a{color:#23664f}
        .notice{padding:12px;background:#edf4ef;margin:12px 0}
        @media(max-width:600px){.module-form{grid-template-columns:1fr}.module-form textarea{grid-column:auto}}
    </style>
</head>
<body>
<header th:replace="~{fragments/site-header :: siteHeader('resources', true)}"></header>
<main class="module-page">
    <h1>Learning Resources</h1>
    <p>Share useful links with the SkillBridge community.</p>
    <div class="notice" th:if="${success != null}" th:text="${success}"></div>
    <div class="notice" th:if="${error != null}" th:text="${error}"></div>
    <form class="module-form" th:action="@{/resources/add}" method="post">
        <input name="title" maxlength="160" placeholder="Resource title" required>
        <input name="url" type="url" placeholder="https://example.com" required>
        <input name="topic" maxlength="100" placeholder="Topic">
        <textarea name="description" maxlength="1000" placeholder="Why is this useful?"></textarea>
        <button type="submit">Share resource</button>
    </form>
    <article class="resource" th:each="resource : ${resources}">
        <h2><a th:href="${resource.url}" target="_blank" rel="noopener noreferrer" th:text="${resource.title}">Resource title</a></h2>
        <p th:if="${resource.topic != null}" th:text="${resource.topic}">Topic</p>
        <p th:if="${resource.description != null}" th:text="${resource.description}">Description</p>
        <p>Shared by <span th:text="${resource.owner.fullName}">Member</span></p>
        <form th:if="${resource.owner.id == currentUser.id}" th:action="@{/resources/delete}" method="post">
            <input type="hidden" name="resourceId" th:value="${resource.id}">
            <button type="submit">Remove</button>
        </form>
    </article>
    <p th:if="${resources.isEmpty()}">No resources have been shared yet.</p>
</main>
</body>
</html>
